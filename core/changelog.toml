[[release]]
at = 2026-10-26T14:06:00+11:00
title = "Brisbane, Melbourne and Sydney transport"
items = [
  { category = "new", area = "Planner", text = "Transport can now be planned on Brisbane, Melbourne and Sydney's trains, metro, trams and ferries: pick the stations and the line, journey time and operator fill in from the official timetables." },
  { category = "new", area = "Map", text = "Those journeys are drawn along the real line on the trip map, and each city's train, tram and ferry lines show in their official colours when a trip goes there." },
  { category = "new", area = "Stays", text = "Stays and activities in those cities get directions from the nearest station, with the lines to take, changes and travel time, as Chinese cities do with MetroMan." },
  { category = "improved", area = "Site", text = "The timetables refresh every week from Translink and Transport Victoria open data. Sydney's join once its Transport for NSW feed is connected." },
]

[[release]]
at = 2026-10-26T14:34:00+11:00
title = "Sydney joins"
items = [
  { category = "new", area = "Planner", text = "Sydney Trains and intercity lines, Sydney Metro, light rail, Sydney Ferries and the Manly Fast Ferry can now be planned from the official timetables, as Brisbane and Melbourne can." },
  { category = "improved", area = "Stays", text = "Journeys where two lines make the same ride read \"T1 or T2\", and three or more read \"Any train\"." },
]

[[release]]
at = 2026-10-26T17:19:00+11:00
title = "Journey planner"
items = [
  { category = "new", area = "Site", text = "A public journey planner for Brisbane, Melbourne and Sydney: search for a park, beach, venue or address, or tap the map, and get up to three ways there by train, metro, tram and ferry, step by step and drawn on the map." },
  { category = "new", area = "Site", text = "Live times from Translink and Transport for NSW where they're published, and the next departures from the stops near you." },
  { category = "security", area = "Site", text = "Your location is used only when you ask, for that one answer, and is never stored, logged or shared." },
]

[[release]]
at = 2026-10-26T18:17:00+11:00
title = "Buses in the journey planner"
items = [
  { category = "new", area = "Site", text = "The journey planner now includes buses in Brisbane, Melbourne and Sydney, and Melbourne's SkyBus, so places like Bondi Beach and Coogee get a proper route." },
  { category = "new", area = "Site", text = "Live bus times in Brisbane and Sydney, and bus departures in the list of what leaves nearby." },
  { category = "improved", area = "Site", text = "Journey searches are much faster: most now take under a second." },
  { category = "fixed", area = "Site", text = "The top menu no longer makes pages wider than a phone screen, and trip pages fit phones again." },
]

[[release]]
at = 2026-10-26T18:42:00+11:00
title = "Booking.com, Klook and Tripadvisor"
items = [
  { category = "new", area = "Planner", text = "Booking.com, Klook, Tripadvisor and Viator links fill in stays, activities and transport: the name, city and map pin, and for Booking.com the dates. The sites don't let servers read their pages, so the planner reads the link itself and finds the place on OpenStreetMap." },
  { category = "new", area = "Planner", text = "Booking.com, Klook and Viator confirmations are read: hotel bookings go to a stay, and activity and transfer bookings to an activity or transport, with the booking number, times, meeting point and amount paid." },
  { category = "security", area = "Planner", text = "Booking.com's PIN codes are removed from confirmations like other PINs." },
  { category = "improved", area = "Planner", text = "Maps and routes use no Google services: Google Maps links are no longer read." },
]

[[release]]
at = 2026-10-26T18:52:00+11:00
title = "Walking along the streets"
items = [
  { category = "improved", area = "Site", text = "Journey planner walks now follow real streets, paths and bridges from OpenStreetMap, both on the map and in the walking times, so a stop just across a river is no longer treated as close by." },
  { category = "improved", area = "Site", text = "Changes between stops use the same street walks, so a connection only appears where you can really walk it in time." },
  { category = "security", area = "Site", text = "Walks are worked out on this site's own server: your location is still never sent to any other service." },
]

[[release]]
at = 2026-10-26T19:38:00+11:00
title = "Tidier itinerary"
items = [
  { category = "improved", area = "Itinerary", text = "The itinerary no longer shows \"Check\" links to timetable and fare sites; they're on the Transport page and transport form, where routes are added and edited." },
]

[[release]]
at = 2026-10-26T19:42:00+11:00
title = "Countdown"
items = [
  { category = "new", area = "Itinerary", text = "A live countdown above the itinerary: days, hours, minutes and seconds until the first departure, or a date and time you set with your own words in the trip's settings. During the trip it shows which day it is." },
]

[[release]]
at = 2026-10-26T20:25:00+11:00
title = "China trains and journeys into trips"
items = [
  { category = "new", area = "Site", text = "Journey planner has a China trains tab: choose two stations and a day to see China Railway's trains (from 12306) with times and seats left, filtered by kind of train and time. For days beyond the 15-day ticket window it shows the same weekday's trains and when tickets go on sale." },
  { category = "new", area = "Site", text = "Journey planner can plan for later: choose Leave › Later for any date and time. Days past a city's published timetable use the same weekday from its latest week, and say so." },
  { category = "new", area = "Planner", text = "Signed in, a journey from the planner, or a China train, can be added to a trip as private transport: one leg per ride with its stations, times, line and route on the map." },
  { category = "improved", area = "Site", text = "Journey planner no longer asks for a city first: it works it out from the places you choose, and place search looks in all three cities until it knows." },
]

[[release]]
at = 2026-10-26T20:41:00+11:00
title = "International routes"
items = [
  { category = "improved", area = "Site", text = "Journey planner's China trains tab is now International routes, with China Railway's trains across mainland China and to Hong Kong West Kowloon." },
  { category = "new", area = "Planner", text = "Signed in, International routes also finds direct flights between two airports on a day, with times, terminals and aircraft from AeroDataBox, and adds a flight to a trip as private transport. Each airport's day is looked up once and kept, so the free monthly allowance lasts; the units left are shown with the results." },
]

[[release]]
at = 2026-10-26T21:22:00+11:00
title = "Choose how you travel, and driving"
items = [
  { category = "new", area = "Site", text = "Journey planner has Travel by tickboxes: Train, Metro, Tram, Ferry, Bus and Drive. Your choices are remembered in your browser (places never are)." },
  { category = "new", area = "Site", text = "Driving: tick Drive to compare a drive with the public transport options, or on its own, with turn-by-turn directions, the toll roads it uses and an Avoid tolls option. Drives are worked out on this site's server from OpenStreetMap roads, so your location isn't sent anywhere; times are for clear roads and don't include parking." },
  { category = "new", area = "Site", text = "Walk up to 5, 10, 15, 20 or 30 minutes to and from stops, and Step-free only, which uses the accessible stops and services each city's timetable marks (Melbourne and Sydney; Brisbane's timetable doesn't say)." },
  { category = "improved", area = "Site", text = "Leave now or on a date and at a time you pick, with separate date and time boxes; Now goes back to live times." },
  { category = "new", area = "Planner", text = "Signed in, a drive can be added to a trip as a private car leg with its route on the map." },
]

[[release]]
at = 2026-10-26T21:46:00+11:00
title = "Nights come from the stays"
items = [
  { category = "improved", area = "Itinerary", text = "Where each night is spent now comes from the trip's stays: \"Overnight in…\", the overnight stops with their weather, the map's numbered stops, the quiet-day bands and the activity days all follow the stay booked for that night. Visitors see the city of every stay (never the hotel's name, address or location)." },
  { category = "improved", area = "Planner", text = "Days no longer have an \"Overnight city\" of their own to keep in step with the stays: edit the stays instead. The cities already entered are kept, but no longer shown." },
]

[[release]]
at = 2026-10-26T22:15:00+11:00
title = "Drive when no stop is nearby, calendar and sharing"
items = [
  { category = "new", area = "Site", text = "With Drive ticked and no public transport stop within your walk of the start, the journey planner says so and drives you to a nearby station instead (allowing 5 minutes to park), with the drive all the way as another option." },
  { category = "improved", area = "Site", text = "Driving now reaches every place the planner covers, such as the Gold Coast, Tweed and Sunshine Coast with Brisbane and the outer suburbs of Melbourne and Sydney. The wider road maps arrive over the next few hours." },
  { category = "new", area = "Site", text = "Add to calendar saves a journey or drive as a calendar entry with every step and a reminder 10 minutes before you leave. It's made in your browser, so nothing is sent anywhere." },
  { category = "new", area = "Site", text = "Share sends a link that opens the same journey, with a short summary. The places travel after the # in the link, so this site never receives them; if the start is your location, you choose whether to share it exactly or the first stop instead." },
]

[[release]]
at = 2026-10-26T22:49:00+11:00
title = "Select several stays"
items = [
  { category = "new", area = "Planner", text = "The Stays page has a tickbox on each stay and a Select all, so several stays can be made public or private, or deleted, together. Deleting lists exactly which stays will go and asks first." },
]

[[release]]
at = 2026-10-26T23:19:00+11:00
title = "Stays carry their nights and weather"
items = [
  { category = "improved", area = "Planner", text = "The planner's trip page no longer has an Overnight stops list under the map: each stay on the Stays page shows its trip days, nights, check-in and check-out times, weather and the activities planned on its days." },
  { category = "improved", area = "Stays", text = "The trip's Stays page shows each stay's days, weather and what's planned, and check-in and check-out times for public stays. Private stays now appear too, with only their city, dates and weather (never the hotel or how to get there)." },
  { category = "improved", area = "Planner", text = "On your map, each hotel pin carries its city's number and name, instead of a separate marker for the city. Visitors still see numbered city markers, never hotel locations." },
]

[[release]]
at = 2026-10-28T23:46:00+11:00
title = "Privacy policy and terms"
items = [
  { category = "new", area = "Site", text = "The Legals page now has a privacy policy, terms and conditions, and credits for the maps, timetables and other data the site uses." },
  { category = "security", area = "Site", text = "Server access logs now start fresh each day and are deleted after 30 days." },
  { category = "improved", area = "Site", text = "The unfinished Places and About pages were removed. Their old links now go to the home page." },
