[[release]]
at = 2026-11-15T12:33:00+10:00
title = "Planned or booked, one cost, and smarter booking links"
items = [
  { category = "improved", area = "Planner", text = "Stays, transport and activities are now either planned or booked: ideas became planned, and each one went on the checklist to review." },
  { category = "improved", area = "Planner", text = "One cost per stay, transport or activity: while it's planned, the cost is an estimate counted in the budget's estimate; once it's booked, it's what the booking cost." },
