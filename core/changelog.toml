  { category = "improved", area = "Site", text = "The site moved to trips.aarondaws.com.au and is now called Aaron Daws Trips. The old travels.aarondaws.com.au address no longer works, so update any bookmarks, shared links or calendar subscriptions." },
]

[[release]]
at = 2026-10-31T13:55:00+11:00
title = "Follow a flight live"
items = [
  { category = "new", area = "Map", text = "While a flight on a trip is in the air, the map shows the plane where it was last heard, the path it has flown so far, and its height and speed. Over the sea, out of receiver range, the plane's position is estimated." },
  { category = "new", area = "Itinerary", text = "Flights show whether they're in the air or have landed, with a Show the plane button." },
  { category = "improved", area = "Map", text = "After landing, a flight's line on the map becomes the path it actually flew that day." },
  { category = "improved", area = "Site", text = "The Legals page now explains live flight positions." },
]

[[release]]
at = 2026-11-15T11:17:00+10:00
title = "Tighter privacy and Melbourne timetables"
items = [
  { category = "security", area = "Itinerary", text = "A public taxi or transfer to or from a hotel now shows only \"Hotel\" and the city, never the hotel itself, and isn't drawn on the public map. The same goes for the trip's calendar file." },
  { category = "security", area = "Itinerary", text = "The countdown and the map's local transport lines now count public plans only." },
  { category = "security", area = "Site", text = "The journey planner no longer sets a cookie for visitors, so the whole site is cookie-free, as the privacy policy says." },
  { category = "security", area = "Site", text = "Stricter browser security rules are now enforced on every page, and oversized requests are turned away." },
  { category = "fixed", area = "Site", text = "Melbourne's train, tram, V/Line and bus timetables update again: PTV moved its timetable file, and the site now finds the new address by itself." },
  { category = "fixed", area = "Itinerary", text = "A journey leaving just before midnight now shows \"+1\" on its arrival when it arrives the next day." },
]

[[release]]
