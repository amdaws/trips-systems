title = "Booking status and costs"
items = [
  { category = "new", area = "Planner", text = "Stays and activities now have a status (idea, planned or booked), as transport already did, shown on the Stays and Activities pages." },
  { category = "new", area = "Planner", text = "Stays, activities and transport have a booking cost. Entering it, or filling it in from a booking link or confirmation that shows the price, adds it to the budget and marks the booking as booked." },
  { category = "improved", area = "Planner", text = "The budget now shows what has been paid, without estimates." },
]

[[release]]
at = 2026-11-15T11:59:00+10:00
title = "Ideas, estimates and confirmations"
items = [
  { category = "new", area = "Planner", text = "Ideas can have an estimated cost. The budget's estimate is everything paid so far plus the estimated cost of each stay, transport and activity that's still an idea." },
  { category = "improved", area = "Planner", text = "New activities start as ideas." },
  { category = "improved", area = "Planner", text = "The budget lists each item's status, estimate and cost in date order, without the old tick columns." },
  { category = "new", area = "Planner", text = "Booked stays, transport and activities have an Add confirmation button: add the confirmation link, or paste or upload the confirmation, to fill in the confirmed details and what it cost." },
  { category = "improved", area = "Planner", text = "Bookings can be imported from the Transport and Activities pages too, not just Stays." },
