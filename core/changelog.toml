# What's new: every release of the travels site, shown at /changelog/.
#
# Add a [[release]] for each deploy that changes something people would notice.
# - at: when it went live, with its UTC offset. Write it in AEST (+10:00); the page shows AEST all year.
# - category: new, improved, fixed or security.
# - area: Itinerary, Map, Planner, Stays, Activities or Site.
# Keep the wording public: no keys, addresses, admin paths or open security issues.

[[release]]
at = 2026-10-25T16:03:00+11:00
title = "The site goes live"
items = [
  { category = "new", area = "Site", text = "travels.aarondaws.com.au is live over HTTPS, served through Cloudflare with certificates that renew automatically." },
]

