{% if field.is_hidden %}{{ field }}{% else %}
<div class="field{% if field.widget_type == 'textarea' %} field--wide{% endif %}">
  {% if field.widget_type == "checkbox" %}
    <label class="check">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required and not field.field.disabled %} <span class="muted">(optional)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
